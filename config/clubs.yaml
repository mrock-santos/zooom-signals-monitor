          label: Elenco Profissional (Squad)
          type: structural
        - path: /clube/parceiros
          label: Parceiros (Sponsors)
          type: structural

    trends_keywords:
      - Grêmio
      - Tricolor Gaúcho

    whois_enabled: true
    site_monitoring_enabled: false  # robots.txt returns HTTP 403

