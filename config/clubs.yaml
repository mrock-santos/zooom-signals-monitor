# Football Clubs Monitoring Configuration
# Generated from real traffic data (Microsoft Clarity 30d + WordPress all-time)
# Data period: 2026-07-24 to 2026-08-23
# Validation: False positives eliminated, robots.txt verified with ZooomBot/1.0 User-Agent
#
# WHOIS monitoring: All 8 clubs enabled (confirmed working on GitHub Actions)
# Site monitoring: 5 clubs enabled, 3 disabled (Athletico HTTP 405, Corinthians HTTP 405, Grêmio HTTP 403)
#
# Distribution:
# - Brazil: 6 clubs (Athletico PR, Corinthians, Grêmio, Santos, Palmeiras, Flamengo)
# - Spain: 2 clubs (Real Madrid, Barcelona)

clubs:
  # ========================================
  # 1. REAL MADRID
  # ========================================
  - id: real-madrid
    name: Real Madrid
    league: La Liga
    country: Spain

    # WHOIS monitoring
    domains:
      - realmadrid.com
      # realmadrid.es removed: Red.es blocks WHOIS access (IP whitelist required)

    # Site monitoring
    official_site:
      url: https://www.realmadrid.com
      monitor_pages:
        - path: /es/futbol/plantilla
          label: Plantilla (Squad)
          type: structural
        - path: /es/club/patrocinadores
          label: Patrocinadores (Sponsors)
          type: structural

    # Google Trends keywords (from real traffic mentions)
    trends_keywords:
      - Real Madrid
      - Vinicius
      - Courtois

    whois_enabled: true
    site_monitoring_enabled: false  # Bot blocking: ZooomBot returns ERROR for all pages

  # ========================================
  # 2. ATHLETICO PARANAENSE
  # ========================================
  - id: athletico-paranaense
    name: Athletico Paranaense
    league: Brasileirão Série A
    country: Brazil

    domains:
      - athletico.com.br
      # furacaoatletico.com removed: domain not registered (WHOIS returns "No match")

    official_site:
      url: https://www.athletico.com.br
      monitor_pages:
        - path: /elenco
          label: Elenco (Squad)
          type: structural
        # /parceiros removed: HTTP 404 (page not found)

    trends_keywords:
      - Athletico Paranaense
      - CAP
      - Athletico PR

    whois_enabled: true
    site_monitoring_enabled: false  # HTTP 405 from GitHub Actions (bot blocking)

  # ========================================
  # 3. CORINTHIANS
  # ========================================
  - id: corinthians
    name: Corinthians
    league: Brasileirão Série A
    country: Brazil

    domains:
      - corinthians.com.br

    official_site:
      url: https://www.corinthians.com.br
      monitor_pages:
        - path: /futebol-masculino/elenco
          label: Elenco (Squad)
          type: structural
        - path: /patrocinadores
          label: Patrocinadores (Sponsors)
          type: structural

    trends_keywords:
      - Corinthians
      - Memphis Depay  # Contract renovation saga
      - Garro

    whois_enabled: true
    site_monitoring_enabled: false  # robots.txt returns HTTP 405

  # ========================================
