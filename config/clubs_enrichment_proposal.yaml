clubs:
  # ========================================
  # 1. REAL MADRID (689 pts, 11 mentions)
  # ========================================
  - id: real-madrid
    name: Real Madrid
    score: 689  # Remove after approval
    mentions: 11  # Remove after approval
    sources: "Clarity + WordPress"  # Remove after approval
    league: La Liga
    country: Spain

    # Official domains
    domains:
      - realmadrid.com
      # realmadrid.es removed: Red.es blocks WHOIS access (IP whitelist required)

    # Official site monitoring
    official_site:
      url: https://www.realmadrid.com
      monitor_pages:
        - path: /es/futbol/plantilla
          label: Plantilla (Squad)
          type: structural
        - path: /es/club/patrocinadores
          label: Patrocinadores (Sponsors)
          type: structural

    # Google Trends keywords (from real mentions)
    trends_keywords:
      - Real Madrid
      - Vinicius  # Mentioned in real URLs
      - Courtois  # Mentioned in real URLs

    whois_enabled: true
    site_monitoring_enabled: true  # Pending robots.txt validation

